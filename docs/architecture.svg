<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-labelledby="title desc">
<title id="title">mp-dance-lora low-latency dance VJ architecture</title>
<desc id="desc">Live camera video goes to Python MediaPipe Pose, then a bounded latest-pose slot, Rust motion engine, Rust renderer, and projector. JavaScript controls the motion engine. SQLite and JSONL recording feed offline Kaggle analysis separately.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}
    .head{font-size:23px;font-weight:700}.sub{font-size:16px}
    .node{stroke-width:2;rx:14;ry:14}
    .live{fill:#e8f4ff;stroke:#2878a8}.rt{fill:#e7f8ef;stroke:#21865b}.off{fill:#fff3d6;stroke:#a56a00}
    .edge{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}
    .dash{stroke-dasharray:7 6}
    .small{font-size:14px;fill:#475569}
  </style>
</defs>
<rect width="1240" height="690" fill="#ffffff"/>
<text x="40" y="42" class="head">mp-dance-lora · Low-latency Dance VJ</text>
<text x="40" y="68" class="sub">Live motion in → continuous visuals out · target machine: 16 GB RAM</text>

<rect x="35" y="125" width="180" height="90" class="node live"/>
<text x="125" y="160" text-anchor="middle" class="head">Camera</text><text x="125" y="188" text-anchor="middle" class="sub">Live human video</text>

<rect x="260" y="125" width="205" height="90" class="node live"/>
<text x="362" y="157" text-anchor="middle" class="head">Python</text><text x="362" y="181" text-anchor="middle" class="sub">MediaPipe Pose</text><text x="362" y="201" text-anchor="middle" class="small">landmarks + timestamps</text>

<rect x="510" y="125" width="190" height="90" class="node live"/>
<text x="605" y="157" text-anchor="middle" class="head">Latest-pose slot</text><text x="605" y="182" text-anchor="middle" class="sub">Bounded queue</text><text x="605" y="201" text-anchor="middle" class="small">drop stale frames</text>

<rect x="745" y="125" width="210" height="90" class="node rt"/>
<text x="850" y="157" text-anchor="middle" class="head">Rust motion engine</text><text x="850" y="182" text-anchor="middle" class="sub">Follow · loop · blend</text><text x="850" y="201" text-anchor="middle" class="small">continues when still</text>

<rect x="1000" y="125" width="205" height="90" class="node rt"/>
<text x="1102" y="157" text-anchor="middle" class="head">Rust renderer</text><text x="1102" y="182" text-anchor="middle" class="sub">wgpu · trails · FX</text><text x="1102" y="201" text-anchor="middle" class="small">fullscreen projection</text>

<path d="M215 170 H254" class="edge"/><path d="M465 170 H504" class="edge"/><path d="M700 170 H739" class="edge"/><path d="M955 170 H994" class="edge"/>

<rect x="745" y="285" width="210" height="82" class="node rt"/>
<text x="850" y="316" text-anchor="middle" class="head">JavaScript UI</text><text x="850" y="341" text-anchor="middle" class="sub">Calibration · color · loop</text>
<path d="M850 285 V225" class="edge"/>
<text x="865" y="253" class="small">WebSocket / OSC</text>

<text x="40" y="420" class="head">Offline data path (not on the rendering critical path)</text>
<rect x="55" y="455" width="225" height="85" class="node off"/>
<text x="167" y="487" text-anchor="middle" class="head">dance.poses.sqlite</text><text x="167" y="514" text-anchor="middle" class="sub">Session + pose records</text>

<rect x="355" y="455" width="190" height="85" class="node off"/>
<text x="450" y="487" text-anchor="middle" class="head">poses.jsonl</text><text x="450" y="514" text-anchor="middle" class="sub">Portable sequences</text>

<rect x="620" y="455" width="245" height="85" class="node off"/>
<text x="742" y="487" text-anchor="middle" class="head">Kaggle / Python</text><text x="742" y="514" text-anchor="middle" class="sub">Metrics · experiments · training</text>

<path d="M362 215 V400 H167 V449" class="edge dash"/>
<text x="185" y="392" class="small">async recording</text>
<path d="M280 497 H349" class="edge"/><path d="M545 497 H614" class="edge"/>
<text x="900" y="475" class="sub">Key rule</text><text x="900" y="501" class="sub">Live output must not wait</text><text x="900" y="524" class="sub">for database writes or training.</text>
<text x="40" y="625" class="small">Design principle: separate capture, inference, motion, and rendering; use bounded/latest-frame data to prevent latency buildup.</text>
</svg>