<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">mp-dance-lora use case diagram</title>
<desc id="desc">Actors for performer, VJ operator, and researcher connected to live capture, projection, calibration, recording, evaluation, training, and safe model deployment use cases.</desc>
<defs>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}
    .heading{font-size:25px;font-weight:700}.actor{font-size:16px;font-weight:600}
    .uc{fill:#fff;stroke:#52647a;stroke-width:1.5}.sys{fill:#f4f7fb;stroke:#8494a7;stroke-width:2}
    .edge{fill:none;stroke:#52647a;stroke-width:1.5}.dash{stroke-dasharray:6 5}
    .label{font-size:13px;fill:#455468}.note{fill:#fff8df;stroke:#c6a64a;stroke-width:1.2}
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52647a"/></marker>
</defs>
<rect x="16" y="16" width="1168" height="788" rx="16" fill="#fff" stroke="#d8dee8"/>
<text x="600" y="54" text-anchor="middle" class="heading">mp-dance-lora — Use Case Diagram</text>
<rect x="250" y="82" width="700" height="680" rx="14" class="sys"/>
<text x="600" y="110" text-anchor="middle" font-size="17" font-weight="700">Dance VJ System</text>
<!-- actors -->
<g stroke="#26364a" stroke-width="2" fill="none">
 <circle cx="105" cy="170" r="16"/><path d="M105 186V235 M76 204H134 M105 235L82 267 M105 235L128 267"/>
