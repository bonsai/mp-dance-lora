<text x="105" y="512" text-anchor="middle" class="actor">VJ Operator</text>
<text x="105" y="742" text-anchor="middle" class="actor">Researcher</text>
<!-- use cases -->
<g class="uc">
 <ellipse cx="420" cy="160" rx="135" ry="27"/><ellipse cx="735" cy="160" rx="145" ry="27"/>
 <ellipse cx="420" cy="230" rx="135" ry="27"/><ellipse cx="735" cy="230" rx="145" ry="27"/>
 <ellipse cx="420" cy="300" rx="135" ry="27"/><ellipse cx="735" cy="300" rx="145" ry="27"/>
 <ellipse cx="420" cy="390" rx="135" ry="27"/><ellipse cx="735" cy="390" rx="145" ry="27"/>
 <ellipse cx="420" cy="460" rx="135" ry="27"/><ellipse cx="735" cy="460" rx="145" ry="27"/>
 <ellipse cx="420" cy="530" rx="135" ry="27"/><ellipse cx="735" cy="530" rx="145" ry="27"/>
 <ellipse cx="420" cy="600" rx="135" ry="27"/><ellipse cx="735" cy="600" rx="145" ry="27"/>
 <ellipse cx="420" cy="680" rx="135" ry="27"/><ellipse cx="735" cy="680" rx="145" ry="27"/>
</g>
<g font-size="14" text-anchor="middle">
 <text x="420" y="165">Capture live movement</text><text x="735" y="155">Estimate body pose</text><text x="735" y="171">with MediaPipe</text>
 <text x="420" y="235">Project visuals in real time</text><text x="735" y="225">Continue motion when</text><text x="735" y="241">performer is still</text>
 <text x="420" y="305">Calibrate camera / projection</text><text x="735" y="295">Adjust effects and</text><text x="735" y="311">motion parameters</text>
 <text x="420" y="395">Record timestamped pose data</text><text x="735" y="385">Export pose dataset</text><text x="735" y="401">(JSONL)</text>
 <text x="420" y="465">Analyze motion quality</text><text x="735" y="455">Train candidate motion /</text><text x="735" y="471">LoRA model</text>
 <text x="420" y="535">Evaluate candidate model</text><text x="735" y="525">Promote or roll back</text><text x="735" y="541">model version</text>
 <text x="420" y="605">Monitor latency, FPS, memory</text><text x="735" y="595">Replay / loop / blend</text><text x="735" y="611">buffered motion</text>
 <text x="420" y="685">Review session / dataset</text><text x="735" y="675">Keep projection independent</text><text x="735" y="691">from training</text>
</g>
